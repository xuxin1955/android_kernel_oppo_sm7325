name: Build postmarketOS

on:
  workflow_dispatch: # 支持手动点击运行

jobs:
  build_gemini:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip openssl qemu-user-static binfmt-support curl
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          cd pmbootstrap
          chmod +x pmbootstrap.py
          # 使用绝对路径建立软链接，这样在任何地方都能执行 pmbootstrap
          sudo ln -sf $(pwd)/pmbootstrap.py /usr/local/bin/pmbootstrap
          cd ..

      - name: Initialize and Configure
        run: |
          # 1. 最小化初始化（建立目录结构）
          pmbootstrap init --non-interactive
          
          # 2. 强制写入小米 5 的关键配置
          # 这样直接修改配置文件，绕过 init 参数报错
          pmbootstrap config device xiaomi-gemini
          pmbootstrap config extra_packages none # 减少体积
          pmbootstrap config ui phosh
          pmbootstrap config repository edge
          pmbootstrap config mirror_alpine http://dl-cdn.alpinelinux.org/alpine/
          pmbootstrap config mirror_postmarketos http://mirror.postmarketos.org/postmarketos/
          
          # 3. 验证配置是否生效
          pmbootstrap config device
          
          # 4. 同步代码（这一步会根据上面的 config 自动拉取 gemini 的配置）
          pmbootstrap pull

      - name: Build rootfs
        run: |
          pmbootstrap install --password "1234" --no-fsprogs

      - name: Export Images
        run: |
          mkdir -p $HOME/output
          pmbootstrap export $HOME/output
          ls -lh $HOME/output  # 调试输出，确认有文件

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmos-xiaomi-gemini
          path: ${{ github.workspace }}/output/*
