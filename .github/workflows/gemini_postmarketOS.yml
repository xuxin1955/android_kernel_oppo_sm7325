name: Build postmarketOS Mi5 (Source Mode)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 工作目录
      PMB_WORK: "/home/runner/pmb_work"
      # pmbootstrap 源码目录
      PMB_SRC: "/home/runner/pmbootstrap_src"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install System Essentials
        run: |
          sudo apt-get update
          # 安装所有必要的系统工具，包括 python3-venv 和构建依赖
          sudo apt-get install -y git python3 python3-pip qemu-user-static bc wget openssl openssh-client

      - name: Clone pmbootstrap Source Directly
        run: |
          # 直接从 GitLab 克隆源码，跳过所有 pip/pipx 索引错误
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git ${{ env.PMB_SRC }}
          
          # 安装 pmbootstrap 运行所需的最小 Python 依赖
          # 使用 --break-system-packages 因为 GitHub Actions 是一次性容器，安全风险可忽略
          cd ${{ env.PMB_SRC }}
          pip3 install --user -r requirements.txt --break-system-packages || true
          
          # 创建一个全局快捷方式
          echo "alias pmb='python3 ${{ env.PMB_SRC }}/pmbootstrap.py --work-path ${{ env.PMB_WORK }}'" >> ~/.bashrc
          # 将源码路径加入 PATH 以便直接调用
          echo "${{ env.PMB_SRC }}" >> $GITHUB_PATH

      - name: Pre-clone pmaports
        run: |
          mkdir -p ${{ env.PMB_WORK }}/cache_git
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            ${{ env.PMB_WORK }}/cache_git/pmaports

      - name: Initialize pmbootstrap
        run: |
          # 使用 python3 路径直接运行
          PMB="python3 ${{ env.PMB_SRC }}/pmbootstrap.py --work-path ${{ env.PMB_WORK }}"
          
          $PMB init <<EOF
          edge
          xiaomi
          gemini
          n
          user
          phosh
          n
          n
          n
          y
          EOF

      - name: Build Rootfs
        run: |
          PMB="python3 ${{ env.PMB_SRC }}/pmbootstrap.py --work-path ${{ env.PMB_WORK }}"
          # 2026年针对小米5的稳定参数
          $PMB install --split --no-fde --extra-space 1024

      - name: Export Images
        run: |
          PMB="python3 ${{ env.PMB_SRC }}/pmbootstrap.py --work-path ${{ env.PMB_WORK }}"
          $PMB export
          
          mkdir -p output
          cp /tmp/postmarketOS-export/* output/
          echo "Xiaomi Mi 5 postmarketOS Build Success" > output/status.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: pmos-gemini-image
          path: output/
