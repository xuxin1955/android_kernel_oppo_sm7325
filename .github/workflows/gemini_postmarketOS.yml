name: Build postmarketOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 工作目录定义
      PMB_WORK: "/home/runner/pmb_work"
      DEVICE: "xiaomi-gemini"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup System Environment
        run: |
          sudo apt-get update
          # 2026年必备：pipx 用于安装隔离的 python 工具
          sudo apt-get install -y pipx git qemu-user-static bc wget openssl
          # 将 pipx 的路径加入系统变量
          pipx ensurepath

      - name: Install pmbootstrap (The 2026 Way)
        run: |
          # 使用 pipx 安装 pmbootstrap，这是目前最推荐的隔离安装方式
          pipx install pmbootstrap
          # 立即生效环境变量
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap --version

      - name: Pre-clone pmaports
        run: |
          # 预先拉取仓库以防止构建中途超时
          mkdir -p ${{ env.PMB_WORK }}/cache_git
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            ${{ env.PMB_WORK }}/cache_git/pmaports

      - name: Initialize & Configure
        run: |
          # 路径必须显式指定
          PB="pipx run pmbootstrap --work-path ${{ env.PMB_WORK }}"
          
          # 非交互式写入配置
          $PB init <<EOF
          edge
          xiaomi
          gemini
          n
          user
          phosh
          n
          n
          n
          y
          EOF

      - name: Build Firmware
        run: |
          PB="pipx run pmbootstrap --work-path ${{ env.PMB_WORK }}"
          # 2026年编译建议：显式指定架构为 armv7 (小米5)
          # --no-fde 是为了确保第一次启动不卡在加密界面
          $PB install --split --no-fde --extra-space 1024

      - name: Export and Package
        run: |
          PB="pipx run pmbootstrap --work-path ${{ env.PMB_WORK }}"
          $PB export
          
          mkdir -p output
          # 复制生成的 boot.img 和 rootfs.img
          cp /tmp/postmarketOS-export/* output/
          
          # 生成一个刷机说明文件
          echo "Flash with: fastboot flash boot <boot.img> && fastboot flash userdata <rootfs.img>" > output/readme.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmos-gemini-2026
          path: output/*
