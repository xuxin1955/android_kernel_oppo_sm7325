name: Build postmarketOS 

on:
  workflow_dispatch:

jobs:
  build_gemini:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip openssl qemu-user-static binfmt-support curl

      - name: Clone pmbootstrap
        run: |
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          cd pmbootstrap
          chmod +x pmbootstrap.py
          sudo ./pmbootstrap.py install
          sudo ln -sf $(pwd)/pmbootstrap.py /usr/local/bin/pmbootstrap
          cd ..

      - name: Create pmbootstrap config (non-interactive, 2026 recommended method)
        run: |
          mkdir -p ~/.config
          cat > ~/.config/pmbootstrap.cfg <<EOF
          [pmbootstrap]
          is_default_channel = True
          mirrors_postmarketos = https://mirrors.tuna.tsinghua.edu.cn/postmarketos
          device = xiaomi-gemini
          arch = armv7
          ui = phosh
          repository = stable
          extra_space = 1024
          jobs = 2
          ccache_size = 5G
          EOF
          # 验证配置
          pmbootstrap config show

      - name: Build rootfs
        run: |
          pmbootstrap install --password "1234" --no-fsprogs

      - name: Export Images
        run: |
          mkdir -p $HOME/output
          pmbootstrap export $HOME/output
          ls -lh $HOME/output

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmos-xiaomi-gemini
          path: ${{ github.workspace }}/output/*
