name: Build_pmOS_Gemini_Pro
on:
  push:
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4
        
      - name: 2. 安装系统底层工具 (2026 强制标准)
        run: |
          # 屏蔽交互式重启提示
          sudo sed -i 's/#$nrconf{restart} = "i";/$nrconf{restart} = "a";/g' /etc/needrestart/needrestart.conf || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git python3 python3-pip qemu-user-static binfmt-support bc wget openssl
          
          # 强制启用 QEMU 模拟器映射 (构建 armv7 核心步骤)
          sudo update-binfmts --enable

      - name: 3. 安装 pmbootstrap (模仿模板链接方式)
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p ~/.local/bin
          # 建立软链接，这样可以直接用 pmbootstrap 命令
          ln -s "$PWD/pmbootstrap/pmbootstrap.py" ~/.local/bin/pmbootstrap
          # 将路径加入环境变量
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 4. 设置 pmaports (官方源)
        run: |
          # 创建工作目录
          mkdir -p ~/.local/var/pmbootstrap/cache_git
          # 直接克隆官方 pmaports
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            ~/.local/var/pmbootstrap/cache_git/pmaports

      - name: 5. 预置配置文件 (核心步骤：防止交互)
        run: |
          mkdir -p ~/.config
          # 生成针对小米 5 (gemini) 的配置文件
          # 这里模仿模板，直接把配置写死，省去 pmbootstrap init
          cat <<EOF > ~/.config/pmbootstrap.cfg
          [pmbootstrap]
          aports = /home/runner/.local/var/pmbootstrap/cache_git/pmaports
          work = /home/runner/.local/var/pmbootstrap
          jobs = $(nproc)
          mirror_alpine = http://dl-cdn.alpinelinux.org/alpine/
          device = xiaomi-gemini
          ui = phosh
          user = user
          timezone = Asia/Shanghai
          EOF

      - name: 6. 编译并导出镜像 (Phosh 桌面版)
        run: |
          # --password 为开机解锁密码 1234
          # --split 分离 boot.img 和 rootfs.img
          # --no-fde 不启用全盘加密，防止小白刷完开不了机
          pmbootstrap install --password 1234 --split --no-fde
          
          # 导出镜像到临时目录
          pmbootstrap export
          
          # 整理产物到 out 目录
          mkdir out
          cp /tmp/postmarketOS-export/boot.img out/boot-gemini.img
          cp /tmp/postmarketOS-export/xiaomi-gemini.img out/rootfs-gemini-phosh.img

      - name: 7. 上传固件
        uses: actions/upload-artifact@v4
        with:
           name: pmos-gemini-phosh
           path: out/*.img
           retention-days: 7
