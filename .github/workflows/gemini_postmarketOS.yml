name: Build_pmOS_Mi5_Final

on:
  workflow_dispatch:

jobs:
  pmOS_Build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库
        uses: actions/checkout@v4

      - name: 2. 安装系统依赖 (2026标准)
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3-full python3-pip qemu-user-static bc wget openssl
          # 必须安装 binfmt 支持，否则无法编译 arm 架构
          sudo apt-get install -y qemu-user-static
          sudo update-binfmts --enable

      - name: 3. 准备 pmbootstrap 源码与虚拟环境
        run: |
          # 克隆源码
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git ~/pmbootstrap
          
          # 创建并激活虚拟环境，安装依赖
          python3 -m venv ~/venv
          ~/venv/bin/pip install --upgrade pip
          ~/venv/bin/pip install -r ~/pmbootstrap/requirements.txt
          
          # 创建工作目录
          mkdir -p ~/pmb_work

      - name: 4. 预克隆 pmaports (防止中途网络失败)
        run: |
          mkdir -p ~/pmb_work/cache_git
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git ~/pmb_work/cache_git/pmaports

      - name: 5. 强制生成配置文件 (避开交互式init)
        run: |
          # 直接写入配置文件，省去手动输入步骤
          mkdir -p ~/.config
          cat <<EOF > ~/.config/pmbootstrap.cfg
          [pmbootstrap]
          aports = ~/pmb_work/cache_git/pmaports
          work = ~/pmb_work
          jobs = $(nproc)
          mirror_alpine = http://dl-cdn.alpinelinux.org/alpine/
          device = xiaomi-gemini
          ui = phosh
          user = user
          timezone = Asia/Shanghai
          EOF

      - name: 6. 开始编译构建 (Rootfs)
        run: |
          # 使用虚拟环境中的 python 运行
          export PATH="~/venv/bin:$PATH"
          python3 ~/pmbootstrap/pmbootstrap.py install --split --no-fde --extra-space 1024

      - name: 7. 导出镜像
        run: |
          export PATH="~/venv/bin:$PATH"
          python3 ~/pmbootstrap/pmbootstrap.py export
          
          mkdir -p output
          # 移动生成的镜像文件
          sudo cp /tmp/postmarketOS-export/* output/
          # 给予权限以便 GitHub Actions 读取
          sudo chmod -R 777 output

      - name: 8. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: pmos-xiaomi-gemini-build
          path: output/*
