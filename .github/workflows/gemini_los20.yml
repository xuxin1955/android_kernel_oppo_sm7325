name: 小米5-LOS20

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib git gnupg gperf \
          lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
          python-is-python3
        mkdir -p ~/.ccache
        echo "max_size = 500M" > ~/.ccache/ccache.conf
        echo "compression = true" >> ~/.ccache/ccache.conf
        export CCACHE_DIR=~/ccache

    - name: 创建工作目录
      run: mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: 清理旧工具链
      run: |
        rm -rf $GITHUB_WORKSPACE/kernel_workspace/gcc64
        rm -rf $GITHUB_WORKSPACE/kernel_workspace/gcc32

    # ✅ 修正：使用 tar -xf 解压 eva-gcc-arm64（而不是 xz -d）
    - name: 下载并解压 eva-gcc-arm64
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        wget https://github.com/mvaisakh/gcc-build/releases/download/31122025/eva-gcc-arm64-31122025.xz
        # 可选：检查文件类型（调试时用）
        # file eva-gcc-arm64-31122025.xz
        tar -xf eva-gcc-arm64-31122025.xz
        mv eva-gcc-arm64-31122025/gcc-arm64/aarch64-elf gcc64

    # ✅ 修正：使用 tar -xf 解压 eva-gcc-arm（而不是 xz -d）
    - name: 下载并解压 eva-gcc-arm
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        wget https://github.com/mvaisakh/gcc-build/releases/download/31122025/eva-gcc-arm-31122025.xz
        # 可选：检查文件类型（调试时用）
        # file eva-gcc-arm-31122025.xz
        tar -xf eva-gcc-arm-31122025.xz
        mv eva-gcc-arm-31122025/gcc-arm/arm-eabi gcc32

    - name: 拉取内核源码
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 -b lineage-20 https://github.com/xuxin1955/android_kernel_xiaomi_msm8996 kernel-source

    - name: 检查 gemini_defconfig 是否存在
      run: |
        ls -la $GITHUB_WORKSPACE/kernel_workspace/kernel-source/arch/arm64/configs/vendor/xiaomi/gemini_defconfig

    - name: 检查 aarch64-elf-gcc 版本
      run: |
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$PATH
        aarch64-elf-gcc --version

    - name: 检查 arm-eabi-gcc 版本
      run: |
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        arm-eabi-gcc --version

    - name: 缓存 ccache
      id: cache-ccache
      uses: actions/cache@v3
      with:
        path: ~/.ccache
        key: ccache-kernel-${{ hashFiles('kernel_workspace/gcc64/**') }}-${{ hashFiles('kernel_workspace/gcc32/**') }}-${{ hashFiles('kernel_workspace/kernel-source/arch/arm64/configs/vendor/xiaomi/gemini_defconfig') }}
        restore-keys: |
          ccache-kernel-

    - name: 编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/kernel-source
        export PATH=/usr/lib/ccache:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export CCACHE_DIR=~/ccache
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-elf-
        export CROSS_COMPILE_ARM32=arm-eabi-
        
        make O=out ARCH=arm64 vendor/xiaomi/gemini_defconfig
        
        ccache -s || true
        
        make -j$(($(nproc)/2)) O=out ARCH=arm64 \
          CROSS_COMPILE=aarch64-elf- \
          CROSS_COMPILE_ARM32=arm-eabi-

    - name: 显示 ccache 统计（编译后）
      run: |
        ccache -s || true

    - name: 检查内核镜像文件
      run: |
        ls -lh ${{ github.workspace }}/kernel_workspace/kernel-source/out/arch/arm64/boot/Image.gz-dtb || echo "Image.gz-dtb 不存在"
        ls -lh ${{ github.workspace }}/kernel_workspace/kernel-source/out/arch/arm64/boot/Image || echo "Image 不存在"

    - name: 导出编译好的内核镜像
      uses: actions/upload-artifact@v4
      with:
        name: Mi5-LOS20
        path: |
          ${{ github.workspace }}/kernel_workspace/kernel-source/out/arch/arm64/boot/Image.gz-dtb
          ${{ github.workspace }}/kernel_workspace/kernel-source/out/arch/arm64/boot/Image

    - name: 拉取 AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/xuxin1955/AnyKernel3

    - name: 拷贝内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/

    - name: 打包刷机包
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/AnyKernel3
        zip -r9 ../Mi5-LOS20-Kernel-eva-GCC.zip . -x "*.git*" "README.md"

    - name: 上传刷机包
      uses: actions/upload-artifact@v4
      with:
        name: Mi5-LOS20-Kernel-eva-GCC
        path: kernel_workspace/Mi5-LOS20-Kernel-eva-GCC.zip
    - name: 拉取 AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/xuxin1955/AnyKernel3

    - name: 拷贝内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/

    - name: 打包刷机包
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/AnyKernel3
        zip -r9 ../Mi5-LOS20-Kernel-eva-GCC.zip . -x "*.git*" "README.md"

    - name: 上传刷机包
      uses: actions/upload-artifact@v4
      with:
        name: Mi5-LOS20-Kernel-eva-GCC
        path: kernel_workspace/Mi5-LOS20-Kernel-eva-GCC.zip
