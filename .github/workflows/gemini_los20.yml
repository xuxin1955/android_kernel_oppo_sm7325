name: 小米5-LOS20-Clang-Only-云编译

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
          lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
          llvm lld llvm-dev
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    # 1. 拉取内核源码
    - name: 拉取内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/xuxin1955/android_kernel_xiaomi_msm8996 -b lineage-20 --depth=1 android-kernel

    # 2. 下载 Clang 编译器（archive 直链）
    - name: 下载 Clang 编译器
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir clang-aosp
        wget -O clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-13.0.0_r13/clang-r450784d.tar.gz
        tar -C clang-aosp/ -zxvf clang.tar.gz

    # 3. 编译内核（仅 Clang）
    - name: 编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:/usr/lib/llvm-*/bin:$PATH
        export ARCH=arm64
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-android-
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export STRIP=llvm-strip
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        make O=out ARCH=arm64 vendor/xiaomi/mi8996_defconfig
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-android- LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip

    # 4. 导出内核镜像
    - name: 上传内核镜像
      uses: actions/upload-artifact@v4
      with:
        name: Mi5-Kernel-Image
        path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz-dtb

    # 5. 拉取 AnyKernel3
    - name: 拉取 AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/xuxin1955/AnyKernel3 --depth=1

    # 6. 拷贝内核到 AK3
    - name: 拷贝内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/

    # 7. 打包刷机包
    - name: 打包 AK3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/AnyKernel3
        zip -r9 ../Mi5-LOS20-Kernel.zip . -x "*.git*" "README.md"

    # 8. 上传刷机包
    - name: 上传刷机包
      uses: actions/upload-artifact@v4
      with:
        name: Mi5-LOS20-Kernel-Zip
        path: kernel_workspace/Mi5-LOS20-Kernel.zip
