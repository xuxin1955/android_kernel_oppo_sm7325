name: 小米5-LOS20-LineageOS-Toolchain
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: 安装依赖
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib git gnupg gperf \
          libncurses5-dev libncursesw5-dev lib32z1-dev liblz4-tool libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
          python3 python-is-python3 gcc-multilib g++-multilib
        mkdir -p ~/.ccache
        echo "max_size = 500M" > ~/.ccache/ccache.conf
        echo "compression = true" >> ~/.ccache/ccache.conf
        export CCACHE_DIR=~/ccache

    - name: 创建工作目录
      run: mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    # 下载 LineageOS 官方 arm64 工具链 4.9
    - name: 下载 LineageOS arm64 工具链
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64

    # 下载 LineageOS 官方 arm32 工具链 4.9
    - name: 下载 LineageOS arm32 工具链
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

    # 拉取内核源码
    - name: 拉取内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 -b lineage-20 https://github.com/xuxin1955/android_kernel_xiaomi_msm8996 kernel-source

    # 检查 defconfig 是否存在
    - name: 检查 defconfig
      run: |
        ls -la $GITHUB_WORKSPACE/kernel_workspace/kernel-source/arch/arm64/configs/vendor/xiaomi/gemini_defconfig

    # 编译内核
    - name: 编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/kernel-source
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export CCACHE_DIR=~/ccache
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        make O=out ARCH=arm64 vendor/xiaomi/gemini_defconfig
        make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-

    # 上传内核镜像
    - uses: actions/upload-artifact@v4
      with:
        name: Mi5-LOS20
        path: kernel_workspace/kernel-source/out/arch/arm64/boot

    # AnyKernel3 打包
    - name: AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/xuxin1955/AnyKernel3
        cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 ../Mi5-LOS20-Kernel.zip . -x "*.git*" "README.md"

    # 上传刷机包
    - uses: actions/upload-artifact@v4
      with:
        name: Mi5-LOS20-Kernel
        path: kernel_workspace/Mi5-LOS20-Kernel.zip
