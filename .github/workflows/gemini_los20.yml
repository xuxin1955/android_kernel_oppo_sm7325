name: 编译小米5-LOS20(Android13)纯净内核

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出当前仓库
      uses: actions/checkout@v3

    - name: 安装编译必备组件
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
          lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python2
        sudo apt-get install -y lib32stdc++6 lib32z1 || echo "Some i386 packages not found, continuing..."
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: 拉取内核源码
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/xuxin1955/android_kernel_xiaomi_msm8996 -b lineage-20 --depth=1 android-kernel

    - name: 下载 Android 13 GCC 10 交叉编译链
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir gcc64 gcc32
        wget -O gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-10/+archive/refs/tags/android-13.0.0_r40.tar.gz
        tar -C gcc64 -xzf gcc-aarch64.tar.gz
        wget -O gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-10/+archive/refs/tags/android-13.0.0_r40.tar.gz
        tar -C gcc32 -xzf gcc-arm.tar.gz

    - name: 编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        make O=out ARCH=arm64 vendor/xiaomi/mi8996_defconfig
        make -j$(nproc --all) O=out ARCH=arm64

    - name: 导出内核镜像
      uses: actions/upload-artifact@v4
      with:
        name: Mi5-LOS20-Kernel
        path: |
          kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz-dtb
          kernel_workspace/android-kernel/out/arch/arm64/boot/Image

    - name: 拉取 AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/xuxin1955/AnyKernel3 --depth=1

    - name: 拷贝内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/

    - name: 打包刷机包
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/AnyKernel3
        zip -r9 ../Mi5-LOS20-Kernel-AK3.zip . -x "*.git*" "README.md"

    - name: 上传刷机包
      uses: actions/upload-artifact@v4
      with:
        name: Mi5-LOS20-Kernel-AK3
        path: kernel_workspace/Mi5-LOS20-Kernel-AK3.zip
