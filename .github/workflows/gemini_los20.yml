name: 小米5-LOS20

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装编译依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib git gnupg gperf \
          lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
          libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
          python-is-python3
        # 创建 ccache 目录并配置
        mkdir -p ~/.ccache
        echo "max_size = 500M" > ~/.ccache/ccache.conf
        echo "compression = true" >> ~/.ccache/ccache.conf
        export CCACHE_DIR=~/ccache

    - name: 创建工作目录
      run: mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    # 缓存 gcc64 工具链
    - name: 缓存/恢复 gcc64
      id: cache-gcc64
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/kernel_workspace/gcc64
        key: gcc64-kdrag0n-aarch64-elf-gcc

    - name: 拉取 kdrag0n aarch64-elf-gcc（若缓存未命中）
      if: steps.cache-gcc64.outputs.cache-hit != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/kdrag0n/aarch64-elf-gcc.git gcc64

    # 缓存 gcc32 工具链
    - name: 缓存/恢复 gcc32
      id: cache-gcc32
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/kernel_workspace/gcc32
        key: gcc32-kdrag0n-arm-eabi-gcc

    - name: 拉取 kdrag0n arm-eabi-gcc（若缓存未命中）
      if: steps.cache-gcc32.outputs.cache-hit != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/kdrag0n/arm-eabi-gcc.git gcc32

    # 不缓存内核源码，每次重新 clone 保证配置和 DTS 最新
    - name: 拉取内核源码
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 -b lineage-20 https://github.com/xuxin1955/android_kernel_xiaomi_msm8996 kernel-source

    # 跳过有问题的 DTB 编译
    - name: 跳过有问题的 DTB
      run: |
        sed -i '/apq8096-v3-pmi8996-mdm9x55-i2s-mtp\.dtb/d' $GITHUB_WORKSPACE/kernel_workspace/kernel-source/arch/arm64/boot/dts/qcom/Makefile

    # 检查 gemini_defconfig 是否存在
    - name: 检查 gemini_defconfig 是否存在
      run: |
        ls -la $GITHUB_WORKSPACE/kernel_workspace/kernel-source/arch/arm64/configs/vendor/xiaomi/gemini_defconfig

    # 检查编译器版本
    - name: 检查 aarch64-elf-gcc 版本
      run: |
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$PATH
        aarch64-elf-gcc --version

    - name: 检查 arm-eabi-gcc 版本
      run: |
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        arm-eabi-gcc --version

    # 缓存 ccache（全局二次加速）
    - name: 缓存 ccache
      id: cache-ccache
      uses: actions/cache@v3
      with:
        path: ~/.ccache
        # key 包含工具链 commit + defconfig 路径，避免不匹配
        key: ccache-kernel-${{ hashFiles('kernel_workspace/gcc64/**') }}-${{ hashFiles('kernel_workspace/gcc32/**') }}-${{ hashFiles('kernel_workspace/kernel-source/arch/arm64/configs/vendor/xiaomi/gemini_defconfig') }}
        restore-keys: |
          ccache-kernel-

    # 编译内核
    - name: 编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/kernel-source
        export PATH=/usr/lib/ccache:$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export CCACHE_DIR=~/ccache
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-elf-
        export CROSS_COMPILE_ARM32=arm-eabi-
        
        make O=out ARCH=arm64 vendor/xiaomi/gemini_defconfig
        
        # 显示 ccache 状态（恢复后）
        ccache -s || true
        
        make -j$(($(nproc)/2)) O=out ARCH=arm64 \
          CROSS_COMPILE=aarch64-elf- \
          CROSS_COMPILE_ARM32=arm-eabi-

    - name: 显示 ccache 统计（编译后）
      run: |
        ccache -s || true

    - name: 检查内核镜像
      run: ls -lh $GITHUB_WORKSPACE/kernel_workspace/kernel-source/out/arch/arm64/boot/Image.gz-dtb

    # 拉取 AnyKernel3
    - name: 拉取 AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/xuxin1955/AnyKernel3

    - name: 拷贝内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/

    - name: 打包刷机包
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/AnyKernel3
        zip -r9 ../Mi5-LOS20-Kernel-kdrag0n-GCC.zip . -x "*.git*" "README.md"

    - name: 上传刷机包
      uses: actions/upload-artifact@v4
      with:
        name: Mi5-LOS20-Kernel-kdrag0n-GCC
        path: kernel_workspace/Mi5-LOS20-Kernel-kdrag0n-GCC.zip
