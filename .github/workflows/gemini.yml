name: 编译小米5-LOS16内核

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - uses: actions/checkout@v3

    - name: 构建编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev cc-toolchain-aarch64-linux-gnu python2 python3 libncurses5-dev
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: 下载 GCC 4.9 编译器
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://googlesource.com -b ndk-release-r21 --depth=1 gcc64
        git clone https://googlesource.com -b ndk-release-r21 --depth=1 gcc32

    - name: 下载内核源码
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_msm8996 -b lineage-16.0 android-kernel

    - name: 修复环境报错 (YYLTYPE)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l || true

    - name: 开始编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc32/bin:$PATH
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        
        # 1. 生成小米5配置
        make gemini_defconfig
        
        # 2. 编译 (移除原来的 LLVM=1 参数)
        make -j$(nproc --all)

    - name: 上传编译结果
      uses: actions/upload-artifact@v4
      with:
        name: Mi5-LOS16-Kernel-Image
        path: |
          kernel_workspace/android-kernel/arch/arm64/boot/Image.gz-dtb
          kernel_workspace/android-kernel/arch/arm64/boot/Image
